<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoMart - Register</title>
    <link rel="stylesheet" href="style.css" />

    <style>
      .register-container {
        max-width: 450px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      }

      .register-container h2 {
        text-align: center;
        color: #23aaad;
        margin-bottom: 10px;
      }

      .register-container p {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
      }

      .register-container label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
      }

      .register-container input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .register-btn {
        width: 100%;
        padding: 12px;
        background: #23aaad;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .register-btn:hover {
        background: #188b8e;
      }

      .login-link {
        text-align: center;
        margin-top: 20px;
      }

      .login-link a {
        color: #23aaad;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>EcoMart</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="order.html">Orders</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <div class="register-container">
      <h2>Create Account</h2>
      <p>Join EcoMart and start shopping</p>

      <form id="registerForm">
        <label>Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        />

        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />

        <label>Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter 10-digit phone number"
          pattern="[0-9]{10}"
          maxlength="10"
          required
        />

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        />

        <label>Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          required
        />

        <button type="submit" class="register-btn">Register</button>
      </form>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login Here</a>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 EcoMart. All Rights Reserved.</p>
    </footer>

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          let name = document.getElementById("name").value.trim();

          let email = document
            .getElementById("email")
            .value.trim()
            .toLowerCase();

          let phone = document.getElementById("phone").value.trim();

          let password = document.getElementById("password").value;

          let confirmPassword =
            document.getElementById("confirmPassword").value;

          // CHECK PASSWORD

          if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
          }

          // LOAD EXISTING USERS

          let users = JSON.parse(localStorage.getItem("ecoUsers")) || [];

          // CHECK DUPLICATE EMAIL

          let existingUser = users.find(function (user) {
            return user.email.toLowerCase() === email;
          });

          if (existingUser) {
            alert("This email is already registered!");
            return;
          }

          // CREATE NEW USER

          let newUser = {
            name: name,
            email: email,
            phone: phone,
            password: password,
          };

          // SAVE USER FOR LOGIN

          users.push(newUser);

          localStorage.setItem("ecoUsers", JSON.stringify(users));

          // LOAD ADMIN CUSTOMER LIST

          let customers =
            JSON.parse(localStorage.getItem("ecoCustomers")) || [];

          // GENERATE CUSTOMER ID

          let newCustomer = {
            customerId: "CU" + Date.now(),

            name: name,

            email: email,

            phone: phone,

            registrationDate: new Date().toLocaleDateString("en-IN"),

            status: "Active",
          };

          // SAVE CUSTOMER FOR ADMIN PANEL

          customers.push(newCustomer);

          localStorage.setItem("ecoCustomers", JSON.stringify(customers));

          alert("Registration successful! Please login.");

          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
