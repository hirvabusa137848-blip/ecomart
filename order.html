<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EcoMart - Order Tracking</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      .order-container {
        width: 85%;
        max-width: 900px;
        margin: 40px auto;
      }

      .order-title {
        text-align: center;
        color: #176b3a;
        margin-bottom: 30px;
      }

      .order-box {
        background: white;
        padding: 30px;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-bottom: 25px;
      }

      .success-message {
        text-align: center;
        color: #176b3a;
        margin-bottom: 25px;
      }

      .order-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
      }

      .detail {
        background: #f3f8f3;
        padding: 15px;
        border-radius: 6px;
        overflow-wrap: anywhere;
      }

      .detail p {
        margin-top: 7px;
      }

      .tracking {
        margin-top: 25px;
      }

      .tracking h2 {
        color: #176b3a;
        margin-bottom: 25px;
      }

      .tracking-step {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
      }

      .step-circle {
        width: 35px;
        height: 35px;
        min-width: 35px;
        border-radius: 50%;
        background: #176b3a;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .step-line {
        width: 3px;
        height: 25px;
        background: #176b3a;
        margin-left: 16px;
        margin-bottom: 10px;
      }

      .tracking-step p {
        color: #666;
        margin-top: 5px;
      }

      .ordered-products {
        margin-top: 20px;
      }

      .ordered-product {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 12px 0;
        border-bottom: 1px solid #ddd;
      }

      .total-row {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 20px;
        font-size: 18px;
      }

      .shop-btn {
        display: block;
        width: fit-content;
        margin: 25px auto 0;
        padding: 12px 25px;
        background: #176b3a;
        color: white;
        text-decoration: none;
        border-radius: 6px;
      }

      .shop-btn:hover {
        background: #10532c;
      }

      .empty-order {
        text-align: center;
        padding: 40px;
      }

      .address-details {
        line-height: 1.8;
        margin-top: 12px;
      }

      .history-title {
        color: #176b3a;
        margin-bottom: 20px;
      }

      .history-card {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
      }

      .history-row {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      .history-status {
        color: #176b3a;
        font-weight: bold;
      }

      .history-card p {
        margin: 8px 0;
      }

      @media (max-width: 600px) {
        .order-details {
          grid-template-columns: 1fr;
        }

        .order-container {
          width: 92%;
        }

        .order-box {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->

    <header>
      <div class="logo">EcoMart</div>

      <div class="search">
        <input type="text" placeholder="Search for groceries..." />
        <button type="button" onclick="window.location.href = 'shop.html'">
          Search
        </button>
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="order.html">Orders</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <!-- ORDER TRACKING -->

    <div class="order-container">
      <h1 class="order-title">Order Tracking</h1>

      <div id="orderContent"></div>

      <!-- ORDER HISTORY -->

      <h2 class="history-title">Previous Orders</h2>

      <div id="orderHistory"></div>
    </div>

    <!-- FOOTER -->

    <footer>
      <h2>EcoMart</h2>
      <p>Sustainable Grocery Shopping Website</p>
      <p>Fresh products. Better choices. Happy shopping.</p>
      <p>© 2026 EcoMart. All Rights Reserved.</p>
    </footer>

    <!-- JAVASCRIPT -->

    <script>
      // GET LATEST ORDER

      let order = JSON.parse(localStorage.getItem("ecoOrder"));

      let orders = JSON.parse(localStorage.getItem("ecoOrders")) || [];

      const orderContent = document.getElementById("orderContent");

      const orderHistory = document.getElementById("orderHistory");

      // SAFELY DISPLAY TEXT

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (character) {
          const characters = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          };

          return characters[character];
        });
      }

      // DISPLAY TRACKING STEPS

      function displayTracking(status) {
        const steps = [
          {
            name: "Order Placed",
            description: "Your order has been received.",
          },
          {
            name: "Order Processing",
            description: "Your order is being prepared.",
          },
          {
            name: "Out for Delivery",
            description: "Your order is on the way.",
          },
          {
            name: "Delivered",
            description: "Your order has been delivered.",
          },
        ];

        let currentStep = 0;

        if (status === "Processing") {
          currentStep = 1;
        } else if (status === "Out for Delivery") {
          currentStep = 2;
        } else if (status === "Delivered") {
          currentStep = 3;
        }

        let trackingHTML = `
                <div class="tracking">
                    <h2>Order Status</h2>
            `;

        steps.forEach(function (step, index) {
          let active = index <= currentStep;

          trackingHTML += `
                    <div class="tracking-step">

                        <div class="step-circle"
                            style="background:${active ? "#176b3a" : "#ccc"}">
                            ${index + 1}
                        </div>

                        <div>
                            <strong>${step.name}</strong>
                            <p>${step.description}</p>
                        </div>

                    </div>
                `;

          if (index !== steps.length - 1) {
            trackingHTML += `
                        <div class="step-line"
                            style="background:${active ? "#176b3a" : "#ccc"}">
                        </div>
                    `;
          }
        });

        trackingHTML += "</div>";

        return trackingHTML;
      }

      // DISPLAY LATEST ORDER

      function displayOrder() {
        if (!order) {
          orderContent.innerHTML = `
                    <div class="order-box empty-order">

                        <h2>No Order Found</h2>

                        <p>You have not placed any order yet.</p>

                        <a href="shop.html" class="shop-btn">
                            Start Shopping
                        </a>

                    </div>
                `;

          return;
        }

        let productsHTML = "";

        (order.products || []).forEach(function (item) {
          let itemTotal = Number(item.price) * Number(item.quantity);

          productsHTML += `
                    <div class="ordered-product">

                        <span>
                            ${escapeHTML(item.name)} x ${escapeHTML(item.quantity)}
                        </span>

                        <strong>₹${itemTotal}</strong>

                    </div>
                `;
        });

        let status = order.status || "Order Placed";

        let subtotal = Number(order.subtotal) || 0;

        let delivery = Number(order.delivery) || 0;

        let total = Number(order.total) || subtotal + delivery;

        orderContent.innerHTML = `

                <div class="order-box">

                    <div class="success-message">

                        <h2>Order Placed Successfully!</h2>

                        <p>Thank you for shopping with EcoMart.</p>

                    </div>


                    <h2>Order Information</h2>

                    <div class="order-details">

                        <div class="detail">
                            <strong>Order ID</strong>
                            <p>${escapeHTML(order.orderId)}</p>
                        </div>

                        <div class="detail">
                            <strong>Order Date</strong>
                            <p>${escapeHTML(order.date)}</p>
                        </div>

                        <div class="detail">
                            <strong>Payment Method</strong>
                            <p>${escapeHTML(order.payment)}</p>
                        </div>

                        <div class="detail">
                            <strong>Order Status</strong>
                            <p>${escapeHTML(status)}</p>
                        </div>

                    </div>


                    ${displayTracking(status)}

                </div>


                <div class="order-box">

                    <h2>Ordered Products</h2>

                    <div class="ordered-products">
                        ${productsHTML}
                    </div>

                    <div class="total-row">
                        <strong>Subtotal</strong>
                        <strong>₹${subtotal}</strong>
                    </div>

                    <div class="total-row">
                        <span>Delivery Charges</span>
                        <span>₹${delivery}</span>
                    </div>

                    <div class="total-row">
                        <strong>Total Amount</strong>
                        <strong>₹${total}</strong>
                    </div>

                    <hr style="margin:25px 0;">

                    <h3>Delivery Address</h3>

                    <div class="address-details">

                        <p>${escapeHTML(order.name)}</p>

                        <p>${escapeHTML(order.address)}, ${escapeHTML(order.city)}</p>

                        <p>Pincode: ${escapeHTML(order.pincode)}</p>

                        <p>Mobile: ${escapeHTML(order.phone)}</p>

                        <p>Email: ${escapeHTML(order.email)}</p>

                    </div>

                </div>

                <a href="shop.html" class="shop-btn">
                    Continue Shopping
                </a>

            `;
      }

      // DISPLAY PREVIOUS ORDERS

      function displayOrderHistory() {
        if (orders.length === 0) {
          orderHistory.innerHTML = `
                    <div class="order-box empty-order">
                        <p>No previous orders available.</p>
                    </div>
                `;

          return;
        }

        let historyHTML = "";

        // Display newest order first

        let reversedOrders = [...orders].reverse();

        reversedOrders.forEach(function (previousOrder) {
          let products = previousOrder.products || [];

          let productNames = products
            .map(function (item) {
              return escapeHTML(item.name) + " x " + escapeHTML(item.quantity);
            })
            .join(", ");

          historyHTML += `

                    <div class="history-card">

                        <div class="history-row">

                            <strong>
                                Order ID: ${escapeHTML(previousOrder.orderId)}
                            </strong>

                            <span class="history-status">
                                ${escapeHTML(previousOrder.status || "Order Placed")}
                            </span>

                        </div>

                        <p>
                            <strong>Date:</strong>
                            ${escapeHTML(previousOrder.date)}
                        </p>

                        <p>
                            <strong>Products:</strong>
                            ${productNames}
                        </p>

                        <p>
                            <strong>Total Amount:</strong>
                            ₹${Number(previousOrder.total) || 0}
                        </p>

                    </div>

                `;
        });

        orderHistory.innerHTML = historyHTML;
      }

      // LOAD ORDER DETAILS

      displayOrder();

      displayOrderHistory();
    </script>
  </body>
</html>
